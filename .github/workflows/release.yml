name: release

# 发版流水线：推送 v* tag 到仓库 → 构建 → 打包 → GitHub Release → 更新 homebrew-tap。
# 触发方：本地发布脚本（同步 + 打 tag + 推送）。
# repo 守卫：仅在 remindkit-cli 仓库执行。
#
# 需要的 secret：
#   TAP_DEPLOY_KEY — homebrew-tap 仓库的 **write deploy key** 私钥（SSH），
#     用于跨仓库推送公式。deploy key 默认不过期，避免 PAT 静默失效
#     （2026-09-11：旧 RELEASE_TOKEN PAT 失效导致 tap 未更新）。
#     设置：gh secret set TAP_DEPLOY_KEY --repo hiauhong/remindkit-cli < <私钥文件>
#     未配置时 tap 更新步骤跳过并告警（Release 照常发布）。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    if: github.repository == 'hiauhong/remindkit-cli'
    runs-on: macos-14 # arm64 runner, matches published binaries
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make build

      - name: Unit tests
        run: swift test

      - name: Package tarball
        run: SKILL_VERSION="${GITHUB_REF_NAME#v}" ./Scripts/package.sh --no-build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH="$(uname -m)"
          TARBALL="dist/remindkit-darwin-${ARCH}.tar.gz"
          # Release notes are written manually: list new features &
          # improvements, not a full commit changelog. No --generate-notes.
          gh release create "$GITHUB_REF_NAME" "$TARBALL"

      - name: Update homebrew-tap formula
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [[ -z "$TAP_DEPLOY_KEY" ]]; then
            echo "::warning::TAP_DEPLOY_KEY secret not configured — skipping tap update (Release was published)."
            exit 0
          fi
          set -euo pipefail
          ARCH="$(uname -m)"
          TARBALL="dist/remindkit-darwin-${ARCH}.tar.gz"
          SHA="$(shasum -a 256 "$TARBALL" | awk '{print $1}')"
          VERSION="${GITHUB_REF_NAME#v}"

          # Write deploy key on homebrew-tap (never expires, unlike a PAT).
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$HOME/.ssh/tap_deploy_key"
          chmod 600 "$HOME/.ssh/tap_deploy_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone --quiet git@github.com:hiauhong/homebrew-tap.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          sed -i '' \
            -e "s/^  version \"[^\"]*\"/  version \"$VERSION\"/" \
            -e "s|/download/v[0-9][0-9.]*/|/download/$GITHUB_REF_NAME/|" \
            -e "s/    sha256 \"[^\"]*\"/    sha256 \"$SHA\"/" \
            Formula/remindkit.rb
          git config user.name "remindkit release bot"
          git config user.email "bot@users.noreply.github.com"
          git add Formula/remindkit.rb
          # Idempotent: a re-run (or a manually pre-fixed formula) has nothing to
          # commit — exit 0 with a notice instead of failing the job.
          if ! git diff --cached --quiet; then
            git commit -m "remindkit $GITHUB_REF_NAME"
            git push origin main
          else
            echo "tap already at $GITHUB_REF_NAME — nothing to push"
          fi

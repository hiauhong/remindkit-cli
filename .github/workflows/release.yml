name: release

# 发版流水线：推送 v* tag 到仓库 → 构建 → 打包 → GitHub Release → 更新 homebrew-tap。
# 触发方：本地发布脚本（同步 + 打 tag + 推送）。
# repo 守卫：仅在 remindkit-cli 仓库执行。
#
# 需要的 secret：
#   TAP_DEPLOY_KEY — homebrew-tap 仓库的 **write deploy key** 私钥（SSH），
#     用于跨仓库推送公式。deploy key 默认不过期，避免 PAT 静默失效
#     （2026-09-11：旧 RELEASE_TOKEN PAT 失效导致 tap 未更新）。
#     设置：gh secret set TAP_DEPLOY_KEY --repo hiauhong/remindkit-cli < <私钥文件>
#     未配置时 tap 更新步骤跳过并告警（Release 照常发布）。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    if: github.repository == 'hiauhong/remindkit-cli'
    runs-on: macos-14 # arm64 runner, matches published binaries
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make build

      - name: Unit tests
        run: swift test

      - name: Package tarball
        run: SKILL_VERSION="${GITHUB_REF_NAME#v}" ./Scripts/package.sh --no-build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH="$(uname -m)"
          TARBALL="dist/remindkit-darwin-${ARCH}.tar.gz"
          # Release notes are written manually: list new features &
          # improvements, not a full commit changelog. No --generate-notes.
          gh release create "$GITHUB_REF_NAME" "$TARBALL"

      - name: Build and upload Homebrew bottle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="$(uname -m)"
          WORK="$(mktemp -d)"
          tar -xzf "dist/remindkit-darwin-${ARCH}.tar.gz" -C "$WORK"
          # Bottle payload = an installed keg: <name>/<version>/{bin,share}.
          # It must be built from the *packaged* tarball so the bundled SKILL.md
          # carries the release version stamp.
          #
          # Tagged `all` on purpose: this formula copies prebuilt binaries and
          # compiles nothing, but without a matching bottle Homebrew classifies
          # the install as a source build and runs fatal_build_from_source_checks
          # — which hard-fails unless an Xcode matching the running macOS major
          # is installed (e.g. macOS 27 + Xcode 26). An `all` bottle matches
          # every platform tag, so brew pours and skips those checks.
          KEG="$WORK/keg/remindkit/${VERSION}"
          mkdir -p "$KEG/bin" "$KEG/share/remindkit/skills"
          cp "$WORK/bin/remindkit" "$WORK/bin/fetch-remindkit" "$KEG/bin/"
          cp -R "$WORK/bin/.agents/skills/remindkit" "$KEG/share/remindkit/skills/remindkit"
          # brew expects this exact asset name for an `all` bottle (single dash).
          tar -czf "dist/remindkit-${VERSION}.all.bottle.tar.gz" -C "$WORK/keg" remindkit
          gh release upload "$GITHUB_REF_NAME" "dist/remindkit-${VERSION}.all.bottle.tar.gz" --clobber
          echo "bottle uploaded: remindkit-${VERSION}.all.bottle.tar.gz"

      - name: Update homebrew-tap formula
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [[ -z "$TAP_DEPLOY_KEY" ]]; then
            echo "::warning::TAP_DEPLOY_KEY secret not configured — skipping tap update (Release was published)."
            exit 0
          fi
          set -euo pipefail
          ARCH="$(uname -m)"
          TARBALL="dist/remindkit-darwin-${ARCH}.tar.gz"
          SHA="$(shasum -a 256 "$TARBALL" | awk '{print $1}')"
          VERSION="${GITHUB_REF_NAME#v}"
          BOTTLE="dist/remindkit-${VERSION}.all.bottle.tar.gz"
          BOTTLE_SHA="$(shasum -a 256 "$BOTTLE" | awk '{print $1}')"

          # Write deploy key on homebrew-tap (never expires, unlike a PAT).
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$HOME/.ssh/tap_deploy_key"
          chmod 600 "$HOME/.ssh/tap_deploy_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone --quiet git@github.com:hiauhong/homebrew-tap.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          sed -i '' \
            -e "s/^  version \"[^\"]*\"/  version \"$VERSION\"/" \
            -e "s|/download/v[0-9][0-9.]*/|/download/$GITHUB_REF_NAME/|" \
            -e "s/    sha256 \"[^\"]*\"/    sha256 \"$SHA\"/" \
            -e "s|^    root_url \".*\"|    root_url \"https://github.com/hiauhong/remindkit-cli/releases/download/$GITHUB_REF_NAME\"|" \
            -e "s|^    sha256 cellar: :any_skip_relocation, all: \"[^\"]*\"|    sha256 cellar: :any_skip_relocation, all: \"$BOTTLE_SHA\"|" \
            Formula/remindkit.rb
          # 瓶必须与公式同步：漏更新 sha256 会让 brew 校验失败退回源码构建（又撞 Xcode 门槛）。
          grep -q "all: \"$BOTTLE_SHA\"" Formula/remindkit.rb || { echo "::error::bottle sha256 not written to formula"; exit 1; }
          grep -q "download/$GITHUB_REF_NAME\"" Formula/remindkit.rb || { echo "::error::bottle root_url not written to formula"; exit 1; }
          git config user.name "remindkit release bot"
          git config user.email "bot@users.noreply.github.com"
          git add Formula/remindkit.rb
          # Idempotent: a re-run (or a manually pre-fixed formula) has nothing to
          # commit — exit 0 with a notice instead of failing the job.
          if ! git diff --cached --quiet; then
            git commit -m "remindkit $GITHUB_REF_NAME"
            git push origin main
          else
            echo "tap already at $GITHUB_REF_NAME — nothing to push"
          fi
